# Configuration Netlify — Yallah Services
# Site statique : aucun build nécessaire, tout est déjà à la racine du dépôt.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Remarque : la version statique n'inclut pas l'espace recruteur (/admin),
# qui nécessite le serveur Node (node server.js).

[[headers]]
  for = "/candidature.html"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/candidature-confirmation.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
